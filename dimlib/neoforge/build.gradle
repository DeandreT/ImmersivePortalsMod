plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'qouteall.dimlib'
version = "${mod_version}+mc${minecraft_version}"
base.archivesName = 'dimlib-neoforge'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

// NFRT's utility-task default is Java 21, independent of the game's toolchain.
// Use the selected Minecraft 26.3 toolchain for asset preparation as well.
def toolingLauncher = javaToolchains.launcherFor(java.toolchain)
tasks.withType(net.neoforged.nfrtgradle.NeoFormRuntimeTask).configureEach {
    javaExecutable.set(toolingLauncher.map { it.executablePath.asFile.absolutePath })
}

repositories {
    mavenCentral()
}

// Only the entry point, config backend and lifecycle hook differ between loaders.
def sharedJava = fileTree('../src/main/java') {
    exclude 'qouteall/dimlib/DimLibEntry.java'
    exclude 'qouteall/dimlib/DimLibEntryClient.java'
    exclude 'qouteall/dimlib/config/**'
}

sourceSets {
    main.resources {
        srcDir('../src/main/resources')
        exclude('fabric.mod.json')
    }
    test.java.srcDir('../src/test/java')
}

// ModDev attaches game libraries to the main source set, not ordinary Java tests.
// These codec/state tests need those libraries, but do not start Minecraft or FML.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.named('compileJava', JavaCompile) {
    source(sharedJava)
}

tasks.named('sourcesJar', Jar) {
    from(sharedJava)
    from('../LICENSE') { rename { 'LICENSE_dimlib' } }
    from('../NOTICE') { rename { 'NOTICE_dimlib' } }
}

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            programArgument('--nogui')
            gameDirectory = file(providers.gradleProperty('dimlibRunDir').getOrElse('build/run-server'))
        }
        client {
            client()
            gameDirectory = file('build/run-client')
        }
    }
    mods {
        dimlib {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly 'org.jetbrains:annotations:26.0.2'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources) {
    inputs.property('version', project.version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: project.version)
    }
}

tasks.named('jar', Jar) {
    from('../LICENSE') { rename { 'LICENSE_dimlib' } }
    from('../NOTICE') { rename { 'NOTICE_dimlib' } }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Check the artifact rather than just declared dependencies: no Fabric classes or
// MidnightLib calls may leak into the native runtime.
def verifyLoaderIsolation = tasks.register('verifyLoaderIsolation') {
    dependsOn(tasks.named('jar'))
    inputs.file(tasks.named('jar', Jar).flatMap { it.archiveFile })
    doLast {
        def artifact = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def forbidden = ['net/fabricmc/', 'eu/midnightdust/', 'com/terraformersmc/']
        new java.util.zip.ZipFile(artifact).withCloseable { zip ->
            assert zip.getEntry('fabric.mod.json') == null : 'Fabric metadata in native artifact'
            assert zip.getEntry('LICENSE_dimlib') != null : 'DimLib license is missing'
            assert zip.getEntry('NOTICE_dimlib') != null : 'DimLib attribution notice is missing'
            zip.entries().each { entry ->
                if (entry.name.endsWith('.class')) {
                    def constants = new String(zip.getInputStream(entry).bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                    forbidden.each { prefix ->
                        assert !constants.contains(prefix) : "${entry.name} references ${prefix}"
                    }
                    if (!entry.name.startsWith('qouteall/dimlib/client/') &&
                        !entry.name.startsWith('qouteall/dimlib/mixin/client/') &&
                        !entry.name.startsWith('qouteall/dimlib/neoforge/client/')) {
                        assert !constants.contains('net/minecraft/client/') : "Common class ${entry.name} references Minecraft client code"
                        assert !constants.contains('qouteall/dimlib/client/') : "Common class ${entry.name} references the client handler"
                    }
                }
            }
        }
    }
}
tasks.named('check') { dependsOn(verifyLoaderIsolation) }
