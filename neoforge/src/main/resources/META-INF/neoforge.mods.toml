modLoader="javafml"
loaderVersion="[12,)"
license="Apache-2.0"
issueTrackerURL="https://github.com/DeandreT/ImmersivePortalsMod/issues"

[[mods]]
modId="immersive_portals"
version="${version}"
displayName="Riftwoven"
logoFile="assets/immersive_portals/icon.png"
authors="qouteall (original author), nyannoying1337 (26.3 port)"
description='''Shape the seed. Discover the world. See through portals and travel between dimensions seamlessly. A development fork of qouteall's Immersive Portals for Minecraft 26.3, based on Immersive Portals Revived and ImmersivelyVibedPortals, with native NeoForge support. Realm Seeds are under development. Report issues to Riftwoven, not the original author.'''

[[dependencies.immersive_portals]]
modId="neoforge"
type="required"
versionRange="[26.3.0.101,)"
ordering="NONE"
side="BOTH"

[[dependencies.immersive_portals]]
modId="minecraft"
type="required"
versionRange="[26.3,26.4)"
ordering="NONE"
side="BOTH"

[[dependencies.immersive_portals]]
modId="dimlib"
type="required"
versionRange="[1.1.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.immersive_portals]]
modId="cloth_config"
type="required"
versionRange="[26.3.159,)"
ordering="AFTER"
side="BOTH"

[[dependencies.immersive_portals]]
modId="pehkui"
type="incompatible"
versionRange="(,3.4.1)"
reason="Riftwoven requires Pehkui 3.4.1 or newer."

[[dependencies.immersive_portals]]
modId="canvas"
type="incompatible"
reason="Canvas replaces rendering paths required by Riftwoven."

[[dependencies.immersive_portals]]
modId="vmp"
type="incompatible"
reason="VMP replaces server chunk tracking required by Riftwoven."

[[dependencies.immersive_portals]]
modId="resolutioncontrol"
type="incompatible"
reason="Resolution Control replaces rendering state required by Riftwoven."

[[dependencies.immersive_portals]]
modId="gravity_api"
type="incompatible"
reason="This Gravity API is incompatible with Riftwoven."

[[mixins]]
config="imm_ptl.mixins.json"
[[mixins]]
config="imm_ptl_peripheral.mixins.json"
[[mixins]]
config="imm_ptl_neoforge.mixins.json"
[[mixins]]
config="imm_ptl_neoforge_compat.mixins.json"
[[mixins]]
config="imm_ptl_compat.mixins.json"
[[mixins]]
config="q_misc_util.mixins.json"

# Lithium reads per-mod overrides on both supported loaders.
[modproperties.immersive_portals]
"lithium:options"={"mixin.world.player_chunk_tick"=false,"mixin.world.combined_heightmap_update"=false}
"sodium:config_api_user"="qouteall.imm_ptl.core.compat.sodium_compatibility.IPSodiumConfigEntryPoint"
